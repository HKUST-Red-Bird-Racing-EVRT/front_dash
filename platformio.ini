; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega328P]
platform = atmelavr
board = ATmega328P
framework = arduino
lib_deps = 	
    autowp/autowp-mcp2515@1.3.1
monitor_speed = 115200
build_flags =
	-Wall
	-pedantic
	-Wextra
	-Os
	-flto
	; Shrink HardwareSerial ring buffers (default 64/64 = 128 B of RAM).
	; The dash only Serial.write()s <=9-byte bursts and never Serial.read()s,
	; so a 32-byte TX ring is ample and RX can be tiny. Frees ~80 B for the SD buffer.
	-DSERIAL_TX_BUFFER_SIZE=32
	-DSERIAL_RX_BUFFER_SIZE=16
check_tool = cppcheck
check_flags = lib/
    cppcheck: --enable=all