; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega328P]
platform = atmelavr
board = ATmega328P
framework = arduino
lib_deps =
    autowp/autowp-mcp2515@1.3.1
    arduino-libraries/SD@^1.3.0
monitor_speed = 115200
; Brown-out reset at 4.3 V. Written with `pio run -t fuses` and a programmer.
board_hardware.bod = 4.3v
build_flags =
	-Wall
	-pedantic
	-Wextra
	-Os
	-flto
	; Smaller Serial buffers to free RAM (TX bursts are 9 bytes, RX unused)
	-DSERIAL_TX_BUFFER_SIZE=32
	-DSERIAL_RX_BUFFER_SIZE=16
check_tool = cppcheck
check_flags = lib/
    cppcheck: --enable=all

; Old test PCB without SD / power-fail, see include/pinMap.h
[env:old_pcb]
extends = env:ATmega328P
build_flags =
	${env:ATmega328P.build_flags}
	-DOLD_PCB
	; no encoder fitted: cycle pages on a timer
	-DPAGE_AUTOCYCLE_MS=3000